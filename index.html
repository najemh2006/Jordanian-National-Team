<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>النشامى - المنتخب الأردني</title>
    <meta name="description" content="تعرّف على لاعبي منتخب الأردن لكرة القدم: المراكز والأندية والأعمار.">
    <meta name="author" content="Najem Haddadin">
    <meta name="theme-color" content="#7a0c1a">

    <meta property="og:type" content="website">
    <meta property="og:title" content="منتخب الأردن - النشامى">
    <meta property="og:description" content="تعرّف على لاعبي منتخب الأردن لكرة القدم">
    <!-- غيّر الرابط التالي إلى رابط موقعك الفعلي (يجب أن يكون مطلقاً) -->
    <meta property="og:image" content="https://YOUR-SITE.github.io/img/background.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@200..800&display=swap" rel="stylesheet">

    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="img/favicon/favicon.ico">
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/style.css">
    <noscript><style>#loader{display:none}</style></noscript>

    <script src="js/players.js" defer></script>
    <script src="js/script.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

</head>
<body>
    <div id="loader" role="status" aria-label="جارٍ التحميل">
        <img src="img/logo.png" alt="" class="loader-logo">
    </div>

    <header>
        <nav class="navbar" aria-label="شريط الأدوات">
            <a href="./" aria-label="الاتحاد الأردني لكرة القدم"><img src="img/logo.png" alt="" class="logo"></a>
            <label class="search">
                <span class="sr-only" data-i18n="searchLabel">ابحث عن لاعب</span>
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input id="search" type="search" data-i18n-ph="ph" placeholder="ابحث عن لاعب أو نادٍ..." autocomplete="off">
            </label>
            <button type="button" id="langBtn" class="lang-btn" data-i18n-aria="langAria" aria-label="English">EN</button>
            <div class="socials">
                <a href="https://github.com/najemh2006" target="_blank" aria-label="GitHub" rel="noopener noreferrer"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.linkedin.com/in/najemhaddadin/" target="_blank" aria-label="LinkedIn" rel="noopener noreferrer"><i class="fa-brands fa-linkedin"></i></a>
            </div>
        </nav>
    </header>

    <main class="layout">
        <div class="pitch-col">
            <div class="toolbar">
                <div class="seg" role="group" aria-label="Formation">
                    <button type="button" class="active" data-f="4-3-3">4-3-3</button>
                    <button type="button" data-f="4-4-2">4-4-2</button>
                    <button type="button" data-f="3-4-3">3-4-3</button>
                </div>
            </div>
            <div class="pitch" id="pitch" data-i18n-aria="pitchLabel" aria-label="تشكيل المنتخب"></div>
        </div>

        <div class="side">
            <section class="block" id="family">
                <h2 data-i18n="family">العائلة الهاشمية</h2>
                <div class="cards">
                    <article class="staff-card">
                        <img src="img/king.jpg" data-i18n-alt="kingAlt" alt="جلالة الملك عبدالله الثاني" width="60" height="60">
                        <div>
                            <h3 data-i18n="king">عبدالله الثاني</h3>
                            <span class="role" data-i18n="kingRole">جلالة الملك</span>
                        </div>
                    </article>
                    <article class="staff-card">
                        <img src="img/prince.jpg" data-i18n-alt="princeAlt" alt="سمو ولي العهد الحسين بن عبدالله الثاني" width="60" height="60">
                        <div>
                            <h3 data-i18n="prince">الحسين بن عبدالله الثاني</h3>
                            <span class="role" data-i18n="princeRole">سمو ولي العهد</span>
                        </div>
                    </article>
                </div>
            </section>

            <section class="block" id="staff-section">
                <h2 data-i18n="staff">أبرز مدربين المنتخب</h2>
                <div class="bench-list" id="staff"></div>
            </section>

            <section class="block" id="bench-section">
                <h2 data-i18n="bench">دكة البدلاء</h2>
                <p class="hint" data-i18n="hint">اضغط على أي لاعب في الملعب أو الدكة لعرض تفاصيله</p>
                <div class="bench-list" id="bench"></div>
                <p id="empty" data-i18n="empty" hidden>لا يوجد لاعب مطابق. جرّب اسماً أو نادياً آخر.</p>
                <noscript><p class="empty">فعّل JavaScript لعرض قائمة اللاعبين.</p></noscript>
            </section>
        </div>
    </main>

    <dialog id="dialog" class="dlg" aria-label="Details">
        <button class="close" type="button" data-i18n-aria="close" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
        <div id="dialogBody"></div>
    </dialog>
    <a href="#" id="backToTop" class="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></a>
</body>
</html>
